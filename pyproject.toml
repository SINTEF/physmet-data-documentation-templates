[project]
name = "Treeweaver"
version = "0.1.0"
description = "Parse file-tree information into a graph / table."
readme = "README.md"
authors = [
    { name = "Tor S. Haugland", email = "tor.haugland@sintef.no" },
    { name = "Jesper Friis", email = "jesper.friis@sintef.no" },
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
]

[project.scripts]
treeweaver = "treeweaver.treeweaver:main"
extract_prefixes = "scripts.extract_prefixes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["treeweaver"]
