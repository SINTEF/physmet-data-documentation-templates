[project]
name = "PhysMetDatadoc"
version = "0.1.0"
description = "Data documentation templates and tools for physical metallurgy."
readme = "README.md"
authors = [
    { name = "Jesper Friis", email = "jesper.friis@sintef.no" },
    { name = "Tor S. Haugland", email = "tor.haugland@sintef.no" },
    { name = "Michele Brigadoi", email = "michele.brigadoi@unibo.it" },
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "tripper[datadoc] @ git+https://github.com/EMMC-ASBL/tripper.git@master",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
excel = ["openpyxl"]
testing = [
    "PhysMetDatadoc[excel]",
    "pytest==9.1.1",
    "pytest-cov==6.0.0",
    "requests>=2.34.2",
]
pre-commit = [
    "PhysMetDatadoc[testing]",
    "pre-commit==4.0.1",
    "pylint==3.3.4",
]
dev = [
    "PhysMetDatadoc[pre-commit]",
    "virtualenvwrapper>=4.0.0",
]

[project.scripts]
extract-prefixes = "extract_prefixes:main"
oold-converter = "oold_converter.oold_converter:main"
parse-compositions = "parse_compositions:main"
treeweaver = "treeweaver.treeweaver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79

# Explicitly tell Hatchling where your packages live
[tool.hatch.build.targets.wheel]
packages = [
    "src/extract_prefixes.py",
    "src/parse_compositions.py",
    "src/oold_converter",
    "src/tabular",
    "src/treeweaver",
]

[tool.hatch.build.targets.sdist]
include = ["/src/oold_converter", "/src/tabular", "/src/treeweaver"]


[tool.hatch.metadata]
allow-direct-references = true

[tool.pylint.messages_control]
disable = ["too-few-public-methods", "redefined-builtin"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = [
    "extract_prefixes",
    "oold_converter",
    "tabular",
    "treeweaver",
]
