[project]
name = "PhysMetDatadoc"
version = "0.1.0"
description = "Data documentation templates and tools for physical metallurgy."
readme = "README.md"
authors = [
    { name = "Jesper Friis", email = "jesper.friis@sintef.no" },
    { name = "Tor S. Haugland", email = "tor.haugland@sintef.no" },
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
testing = [
    "pytest==9.1.1",
    "pytest-cov==6.0.0",
]
pre-commit = [
    "Treeweaver[testing]",
    "pre-commit==4.0.1",
    "pylint==3.3.4",
]
dev = [
    "Treeweaver[pre-commit]",
    "virtualenvwrapper>=4.0.0",
]

[project.scripts]
treeweaver = "treeweaver.treeweaver:main"
extract_prefixes = "extract_prefixes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["treeweaver"]
