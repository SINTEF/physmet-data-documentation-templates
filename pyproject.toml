[project]
name = "Treeweaver"
version = "0.1.0"
description = "Parse file-tree information into a graph / table."
readme = "README.md"
authors = [
    { name = "Tor S. Haugland", email = "tor.haugland@sintef.no" },
    { name = "Jesper Friis", email = "jesper.friis@sintef.no" },
]
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest", "jsonschema", "requests"]

[project.scripts]
treeweaver = "treeweaver.treeweaver:main"
oold-converter = "oold_converter.oold_converter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicitly tell Hatchling where your packages live
[tool.hatch.build.targets.wheel]
packages = ["src/treeweaver", "src/oold_converter"]

[tool.hatch.build.targets.sdist]
include = ["/src/treeweaver", "/src/oold_converter"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["treeweaver", "oold_converter"]
