# Default variable
environment:
  prefix: "avb"

  rightsHolder: "org:NTNU"
  license: "TBD"  # XXX - define a license

  contactPoint: "pers:MarisaDiSabatino"
  creator: "pers:AnderasVollBugten"        # Creator of sample or dataset
  operator: "pers:AnderasVollBugten"       # Operator of an instrument

  # URL to the root folder of your data
  baseURL:


# Patterns matching
# Variables will assigned
patterns:
- "Armel/characterizations/GDmass/{sampleId}/{path}": sample



- "/characterizations/GDmass/{sampleId}": sample


# The different types of data to document
# You probably don't need to modify these
documents:
  sample:
    "@id": "{prefix}:{sampleId}"
    "@type": cameo:Sample
    title: "{sampleId}"
    description: null
    comment: null
    hasComposition: null
    contactPoint: {contactPoint}
    creator: {creator}
    creationDate: {ctime}
    location: null
    isTemporalPartOf: null
    isSpatioTemporalPartOf: null

  dataset:
    "@id": "{prefix}:{sampleId}/{datasetPath}"
    "@type": cameo:Sample
    title: "{datasetPath}"
    description: null
    comment: null
    keyword: null
    rightsHolder: {rightsHolder}
    license: {license}
    contactPoint: {contactPoint}
    creator: {creator}
    seeAlso: null
    releaseDate: {ctime}
    version: null
    priorVersion: null
    processedFrom: null
    #distribution.downloadURL:
    #distribution.accessURL:

  measurement:
    "@id": "avb:{sampleId}{datasetPath}"
    "@type": emmo:Measurement
    title: "datasetFile"
    description: null
    comment: null
    hasInput: {sampleId}
    hasOutput: {datasetId}
    hasOperator: {operator}
    performedWith: {equipmentId}
